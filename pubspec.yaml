name: detention_safe
description: "DetentionSafe - A Flutter app for managing subjects, books with QR codes, and timetables."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Timetable & Calendar
  table_calendar: ^3.0.9
  
  # Color Picker
  flutter_colorpicker: ^1.0.3
  
  # Date/Time Picker
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.1
  
  # Image/File Handling
  image_gallery_saver: ^2.0.3
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  
  # UUID for unique IDs
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
