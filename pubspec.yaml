name: classflow
description: "ClassFlow - Manage your classes, books and timetable with QR codes."
publish_to: 'none'
version: 0.1.1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Timetable & Calendar
  table_calendar: ^3.0.9
  
  # Color Picker
  flutter_colorpicker: ^1.0.3
  
  # Date/Time Picker
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.1
  
  # Image/File Handling
  share_plus: ^7.2.1
  permission_handler: ^11.1.0
  file_selector: ^1.0.0
  # file_picker removed due to Android embedding compatibility issues
  
  # UUID for unique IDs
  uuid: ^4.2.1
  # PDF generation and printing
  pdf: ^3.10.1
  printing: ^5.10.1
  barcode: ^2.1.0

  # Windows installer packaging
  msix: ^3.16.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true

msix_config:
  display_name: ClassFlow
  publisher_display_name: OmgRod
  identity_name: dev.omgrod.classflow
  msix_version: 0.1.1.0
  publisher: CN=OmgRod

  logo_path: windows/runner/resources/app_icon.ico
  start_menu_icon_path: windows/runner/resources/app_icon.ico
  tile_icon_path: windows/runner/resources/app_icon.ico
  vs_generated_images_folder_path: windows/runner/resources

  capabilities: "internetClient"
  device_capabilities:
    - webcam
  # Ensure CI/non-interactive builds: do not sign within msix, no cert prompts
  sign_msix: false
  install_certificate: false
