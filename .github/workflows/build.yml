name: Build ClassFlow


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: |
          cd build
          zip -r ../classflow-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-web
          path: classflow-web.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Zip linux runner
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../classflow-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-linux
          path: classflow-linux.zip

  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Upload portable Release folder
        uses: actions/upload-artifact@v4
        with:
          name: classflow-windows-portable
          path: build/windows/x64/runner/Release

  build-windows-msix:
    runs-on: windows-latest
    env:
      SIGN_CERT: ${{ secrets.SIGN_CERT }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Setup Windows SDK for signtool
        uses: microsoft/setup-msbuild@v2
      - name: Build unsigned MSIX
        shell: powershell
        run: |
          flutter pub run msix:create
      - name: Reconstruct PFX from base64 secret
        if: env.SIGN_CERT != ''
        shell: powershell
        run: |
          $pfxPath = Join-Path $PWD 'omgrod-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_CERT))
          Write-Host "Wrote PFX to $pfxPath"
      - name: Sign MSIX via signtool
        if: env.SIGN_CERT != '' && env.SIGN_CERT_PASSWORD != ''
        shell: powershell
        run: |
          $msix = 'build/windows/x64/runner/Release/classflow.msix'
          if (-not (Test-Path $msix)) { throw "MSIX not found at $msix" }
          # Find signtool from Windows SDK
          $kits = @("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "${env:ProgramFiles}\Windows Kits\10\bin")
          $signtool = $null
          foreach ($k in $kits) {
            if (Test-Path $k) {
              $found = Get-ChildItem -Path $k -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | 
                       Sort-Object FullName -Descending | Select-Object -First 1
              if ($found) { $signtool = $found.FullName; break }
            }
          }
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Path
          }
          if (-not $signtool) { throw 'signtool.exe not found. Ensure Windows SDK is installed.' }
          Write-Host "Using signtool: $signtool"
          & "$signtool" sign /fd sha256 /f omgrod-code-signing.pfx /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 $msix
          if ($LASTEXITCODE -ne 0) { throw "signtool signing failed with exit code $LASTEXITCODE" }
          Write-Host 'MSIX signed successfully.'
      - name: Verify MSIX signature
        if: env.SIGN_CERT != '' && env.SIGN_CERT_PASSWORD != ''
        shell: powershell
        run: |
          $msix = 'build/windows/x64/runner/Release/classflow.msix'
          # Find signtool
          $kits = @("${env:ProgramFiles(x86)}\Windows Kits\10\bin", "${env:ProgramFiles}\Windows Kits\10\bin")
          $signtool = $null
          foreach ($k in $kits) {
            if (Test-Path $k) {
              $found = Get-ChildItem -Path $k -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | 
                       Sort-Object FullName -Descending | Select-Object -First 1
              if ($found) { $signtool = $found.FullName; break }
            }
          }
          if (-not $signtool) {
            $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Path
          }
          if (-not $signtool) { throw 'signtool.exe not found for verification.' }
          Write-Host "Verifying signature with: $signtool"
          & "$signtool" verify /pa /v $msix
          if ($LASTEXITCODE -ne 0) { throw "MSIX signature verification failed with exit code $LASTEXITCODE" }
          Write-Host 'MSIX signature verified successfully.'
      - name: Upload MSIX installer
        uses: actions/upload-artifact@v4
        with:
          name: classflow-windows-msix
          path: build/windows/x64/runner/Release/classflow.msix

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app bundle (if present)
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_FILES=$(find "$APP_DIR" -maxdepth 3 -name "*.app" -print || true)
          if [ -z "$APP_FILES" ]; then
            echo "No .app bundles found under $APP_DIR; skipping macOS artifact.";
            exit 0;
          fi
          # Create zip with app bundles
          zip -r classflow-macos.zip $APP_FILES
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-macos
          path: classflow-macos.zip

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build iOS app unsigned
      run: flutter build ios --no-codesign

    - name: Create unsigned IPA manually
      run: |
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r build/ios/unsigned.ipa Payload
        rm -rf Payload

    - name: Upload iOS IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/ios/unsigned.ipa
