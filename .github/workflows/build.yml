name: Build ClassFlow

env:
  SIGN_CERT: ${{ secrets.WINDOWS_SIGN_CERT }}
  SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release
      - name: Zip web build
        run: |
          cd build
          zip -r ../classflow-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-web
          path: classflow-web.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Zip linux runner
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../classflow-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-linux
          path: classflow-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Reconstruct PFX from base64 secret
        shell: powershell
        run: |
          if (-not $env:SIGN_CERT) { throw 'SIGN_CERT (base64 PFX) env variable not set.' }
          $pfxPath = Join-Path $PWD 'omgrod-code-signing.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGN_CERT))
          Write-Host "Wrote PFX to $pfxPath"
      - name: MSIX + Portable build
        shell: powershell
        run: |
          # Build unsigned MSIX (no cert config in pubspec)
          flutter pub run msix:create
      - name: Locate signtool.exe
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
          if ($signtool) { echo "SIGNSRC=$($signtool.Path)" >> $env:GITHUB_ENV; exit 0 }
          # Try Visual Studio installation via vswhere
          $vswhere = "$Env:ProgramFiles(x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
            if ($vs) {
              $candidate = Join-Path $vs "Common7\Tools\vsdevcmd.bat"
              if (Test-Path $candidate) { cmd /c "$candidate & where signtool" | ForEach-Object { if (Test-Path $_) { echo "SIGNSRC=$_" >> $env:GITHUB_ENV } } }
            }
          }
          # Search Windows Kits folders
          $kits = @("$Env:ProgramFiles(x86)\Windows Kits\10\bin", "$Env:ProgramFiles\Windows Kits\10\bin")
          foreach ($k in $kits) {
            if (Test-Path $k) {
              $found = Get-ChildItem -Path $k -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) { echo "SIGNSRC=$($found.FullName)" >> $env:GITHUB_ENV; break }
            }
          }
          if (-not $env:SIGNSRC) {
            Write-Host 'signtool not found; installing Windows SDK via winget'
            try {
              winget install --id Microsoft.WindowsSDK -e --source winget --silent
            } catch {
              Write-Host 'winget install failed or unavailable.'
            }
            $signtool = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($signtool) { echo "SIGNSRC=$($signtool.Path)" >> $env:GITHUB_ENV }
          }
          if (-not $env:SIGNSRC) { throw 'signtool.exe not found after attempts.' }
      - name: Sign MSIX via signtool
        if: success()
        shell: powershell
        run: |
          $msix = 'build/windows/x64/runner/Release/classflow.msix'
          if (-not (Test-Path $msix)) { throw "MSIX not found at $msix" }
          if (-not $env:SIGN_CERT_PASSWORD) { throw 'SIGN_CERT_PASSWORD secret not set' }
          $signtoolPath = $env:SIGNSRC
          if (-not $signtoolPath) { throw 'signtool path environment variable SIGNSRC not set' }
          & "$signtoolPath" sign /fd sha256 /f omgrod-code-signing.pfx /p $env:SIGN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 $msix
          Write-Host 'MSIX signed successfully.'
      - name: Upload MSIX installer
        uses: actions/upload-artifact@v4
        with:
          name: classflow-windows-msix
          path: build/windows/x64/runner/Release/classflow.msix
      - name: Remove MSIX before portable upload
        shell: powershell
        run: |
          $msix = 'build/windows/x64/runner/Release/classflow.msix'
          if (Test-Path $msix) { Remove-Item $msix -Force }
      - name: Upload portable Release folder
        uses: actions/upload-artifact@v4
        with:
          name: classflow-windows-portable
          path: build/windows/x64/runner/Release

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app bundle (if present)
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_FILES=$(find "$APP_DIR" -maxdepth 3 -name "*.app" -print || true)
          if [ -z "$APP_FILES" ]; then
            echo "No .app bundles found under $APP_DIR; skipping macOS artifact.";
            exit 0;
          fi
          # Create zip with app bundles
          zip -r classflow-macos.zip $APP_FILES
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-macos
          path: classflow-macos.zip

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build iOS app unsigned
      run: flutter build ios --no-codesign

    - name: Create unsigned IPA manually
      run: |
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r build/ios/unsigned.ipa Payload
        rm -rf Payload

    - name: Upload iOS IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/ios/unsigned.ipa
