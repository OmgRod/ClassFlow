  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: classflow-windows-nsis
  #         path: classflow-setup-1.0.0.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Zip macOS app bundle (if present)
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          APP_FILES=$(find "$APP_DIR" -maxdepth 3 -name "*.app" -print || true)
          if [ -z "$APP_FILES" ]; then
            echo "No .app bundles found under $APP_DIR; skipping macOS artifact.";
            exit 0;
          fi
          # Create zip with app bundles
          zip -r classflow-macos.zip $APP_FILES
      - uses: actions/upload-artifact@v4
        with:
          name: classflow-macos
          path: classflow-macos.zip

  build-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build iOS app unsigned
      run: flutter build ios --no-codesign

    - name: Create unsigned IPA manually
      run: |
        mkdir -p Payload
        cp -r build/ios/iphoneos/Runner.app Payload/
        zip -r build/ios/unsigned.ipa Payload
        rm -rf Payload

    - name: Upload iOS IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-unsigned-ipa
        path: build/ios/unsigned.ipa
